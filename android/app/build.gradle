plugins {
    id 'com.android.application'
}

android {
    namespace 'info.cdljob.driverhub'
    compileSdk 36

    defaultConfig {
        applicationId 'info.cdljob.driverhub'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '0.7.0'
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        buildConfigField 'String', 'FIREBASE_PROJECT_ID', '"' + (System.getenv('FIREBASE_PROJECT_ID') ?: '') + '"'
        buildConfigField 'String', 'FIREBASE_APPLICATION_ID', '"' + (System.getenv('FIREBASE_APPLICATION_ID') ?: '') + '"'
        buildConfigField 'String', 'FIREBASE_API_KEY', '"' + (System.getenv('FIREBASE_API_KEY') ?: '') + '"'
        buildConfigField 'String', 'FIREBASE_GCM_SENDER_ID', '"' + (System.getenv('FIREBASE_GCM_SENDER_ID') ?: '') + '"'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Signing credentials are never stored in Git. Release artifacts are signed
    // only when the deployment workflow injects a validated keystore and secrets.
    signingConfigs {
        production {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.production
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.firebase:firebase-messaging:24.1.1'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
