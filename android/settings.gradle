pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Official Maven Central alternate hostname for intermittent runner/CDN misses.
        maven { url 'https://repo1.maven.org/maven2' }
    }
}

rootProject.name = 'CDLDriverHub'
include ':app'
