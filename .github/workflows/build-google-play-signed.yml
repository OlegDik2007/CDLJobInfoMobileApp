name: Build signed CDL Hub Google Play AAB

on:
  workflow_dispatch:
    inputs:
      package_confirmation:
        description: "Confirm existing Play Console package by typing info.cdljob.driverhub"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: google-play-signed-internal
  cancel-in-progress: false

jobs:
  signed-aab:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4

      - name: Validate package identity and presence of secrets
        env:
          PACKAGE_CONFIRMATION: ${{ inputs.package_confirmation }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APPLICATION_ID: ${{ secrets.FIREBASE_APPLICATION_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_GCM_SENDER_ID: ${{ secrets.FIREBASE_GCM_SENDER_ID }}
          CDL_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.CDL_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          CDL_PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.CDL_PLAY_UPLOAD_STORE_PASSWORD }}
          CDL_PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.CDL_PLAY_UPLOAD_KEY_ALIAS }}
          CDL_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.CDL_PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$PACKAGE_CONFIRMATION" != "info.cdljob.driverhub" ]]; then
            echo "::error::Confirm the existing Play Console applicationId before signing"
            exit 1
          fi
          missing=0
          for key in FIREBASE_PROJECT_ID FIREBASE_APPLICATION_ID FIREBASE_API_KEY FIREBASE_GCM_SENDER_ID \
                     CDL_PLAY_UPLOAD_KEYSTORE_BASE64 CDL_PLAY_UPLOAD_STORE_PASSWORD \
                     CDL_PLAY_UPLOAD_KEY_ALIAS CDL_PLAY_UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $key"
              missing=1
            fi
          done
          if [[ "$missing" != "0" ]]; then exit 1; fi
          echo "Package identity confirmed and required secret names are populated"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up icon renderer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render approved CDL Hub launcher
        run: |
          python3 -m pip install --quiet pillow
          python3 ../branding/render_icons.py --platform android

      - name: Decode and validate upload keystore
        env:
          CDL_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.CDL_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          CDL_PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.CDL_PLAY_UPLOAD_STORE_PASSWORD }}
          CDL_PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.CDL_PLAY_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          KEYFILE="$RUNNER_TEMP/cdl-hub-upload-keystore.jks"
          printf '%s' "$CDL_PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYFILE"
          test -s "$KEYFILE"
          keytool -list -keystore "$KEYFILE" \
            -storepass "$CDL_PLAY_UPLOAD_STORE_PASSWORD" \
            -alias "$CDL_PLAY_UPLOAD_KEY_ALIAS" > /dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYFILE" >> "$GITHUB_ENV"
          echo "Upload keystore validated; values were not printed"

      - name: Build signed Android App Bundle
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APPLICATION_ID: ${{ secrets.FIREBASE_APPLICATION_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_GCM_SENDER_ID: ${{ secrets.FIREBASE_GCM_SENDER_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CDL_PLAY_UPLOAD_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.CDL_PLAY_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.CDL_PLAY_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease

      - name: Verify bundle and cryptographic signature
        run: |
          set -euo pipefail
          BUNDLE="app/build/outputs/bundle/release/app-release.aab"
          test -s "$BUNDLE"
          unzip -t "$BUNDLE" > /dev/null
          jarsigner -verify -strict "$BUNDLE" > /dev/null
          echo "### CDL Hub signed internal-test candidate (versionCode 12)" >> "$GITHUB_STEP_SUMMARY"
          echo "Signed AAB signature and zip integrity verified; check package in Play Console before upload" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed bundle as artifact (not a store submission)
        uses: actions/upload-artifact@v4
        with:
          name: CDLHub-GooglePlay-v12-signed-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove ephemeral keystore
        if: always()
        run: |
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" && -f "$ANDROID_KEYSTORE_PATH" ]]; then
            shred -u "$ANDROID_KEYSTORE_PATH" || rm -f "$ANDROID_KEYSTORE_PATH"
          fi
