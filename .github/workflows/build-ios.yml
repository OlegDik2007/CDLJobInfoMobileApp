name: Build CDL Driver Hub iOS

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - 'branding/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/CDLDriverHub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Python for shared branding
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render CDL Hub AppIcon from shared artwork
        run: |
          python3 -m pip install --quiet cairosvg pillow
          python3 ../../branding/render_icons.py --platform ios

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project CDLDriverHub.xcodeproj \
            -target CDLDriverHub \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
