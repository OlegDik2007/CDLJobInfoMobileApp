name: Verify iOS release archive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'branding/**'
      - '.github/workflows/archive-ios.yml'
permissions:
  contents: read
jobs:
  unsigned-device-archive:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/CDLDriverHub
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Set up Python for shared branding
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render CDL Hub release AppIcon from shared SVG
        run: |
          python3 -m pip install --quiet cairosvg pillow
          python3 ../../branding/render_icons.py --platform ios

      - name: Compile iOS release archive (not signed)
        run: |
          xcodebuild -project CDLDriverHub.xcodeproj \
            -scheme CDLDriverHub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CDLDriverHub.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
      - name: Archive compilation succeeded
        run: echo 'Release archive compiles. Production IPA requires Apple Developer signing and provisioning.'
